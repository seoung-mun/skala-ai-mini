[project]
name = "finagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn",
    "langgraph",
    "langsmith",
    # fastmcp 4.x는 mcp 2.x를 요구하고 다른 패키지와 충돌한다(실측). 검증된 조합으로 고정.
    "fastmcp==2.14.7",
    "mcp==1.30.0",
    "sentence-transformers",
    "faiss-cpu",
    "numpy",
    "python-dotenv>=1.2.4",
    "openai>=3.35.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finagent"]
